- question: What was the total transaction amount in the most recent transaction month?
  tier: bi_recency
  reference_answer: Apr 2026 total ~= 27,730.45.
  difficulty_justification: '# tests: bi_recency (filter to the latest data / MAX(month);
    no trap).'
  golden_sql: "SELECT ROUND(SUM(amount), 2) AS latest_month_amount\nFROM `{project}.{dataset}.transactions`\n\
    WHERE DATE_TRUNC(txn_date, MONTH) = (\n  SELECT DATE_TRUNC(MAX(txn_date), MONTH)\n\
    \  FROM `{project}.{dataset}.transactions`\n)\n"
  asserts:
  - type: ai-judge
    value: The most recent transaction month is April 2026 with a total transaction
      amount of approximately {scalar:latest_month_amount}. PASS only if the response
      reports the latest month's total within ~2%.
- question: How many transactions occurred in each merchant category?
  tier: bi_groupby
  reference_answer: 10 categories, ~2,000 each.
  difficulty_justification: '# tests: bi_groupby (COUNT grouped by a dimension over
    one clean fact; no trap).'
  golden_sql: 'SELECT merchant_category, COUNT(*) AS txn_count

    FROM `{project}.{dataset}.transactions`

    GROUP BY merchant_category

    '
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: The response must return a transaction count per merchant category across
      {row_count} categories (each roughly 2,000; ~20,000 total).
- question: How many transactions larger than $200 occurred in 2026?
  tier: bi_multifilter
  reference_answer: 88 transactions.
  difficulty_justification: '# tests: bi_multifilter (two-condition WHERE: amount
    threshold AND year; no trap).'
  golden_sql: 'SELECT COUNT(*) AS n

    FROM `{project}.{dataset}.transactions`

    WHERE amount > 200 AND EXTRACT(YEAR FROM txn_date) = 2026

    '
