- question: What is the total account balance across the bank?
  tier: duplication
  reference_answer: 6,073,496.58 (de-duplicated on account_id).
  difficulty_justification: "# tests: duplication \u2014 ~5% of account rows are an\
    \ ETL double-load (second load_batch_id). Correct de-duplicates on account_id;\
    \ raw SUM reports 6,416,658.57."
  golden_sql: "SELECT ROUND(SUM(balance), 2) AS total_balance\nFROM (\n  SELECT balance\n\
    \  FROM `{project}.{dataset}.accounts`\n  QUALIFY ROW_NUMBER() OVER (PARTITION\
    \ BY account_id ORDER BY load_batch_id) = 1\n)\n"
  asserts:
  - type: ai-judge
