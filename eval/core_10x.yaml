- question: On average, how many transactions did each account have in 2026?
  tier: bi_timefilter_zerofill
  reference_answer: 1.82 (2,187 transactions in 2026 / 1,200 accounts, incl. ~282
    accounts with zero 2026 transactions).
  difficulty_justification: "# tests: zero_fill \xD7 child-side time filter \u2014\
    \ the numerator is filtered to 2026 transactions, but the denominator must stay\
    \ ALL 1,200 accounts. Filtering the child (transactions) in a WHERE turns the\
    \ parent LEFT JOIN into an INNER join and drops the ~282 accounts with zero 2026\
    \ transactions, shrinking the denominator to 918 and inflating the average to\
    \ ~2.38. LookML cure: a parameter-driven conditional-aggregate numerator (transactions.count_in_selected_year).\
    \ Graph cure: a precomputed transaction_count_2026 node property."
  golden_sql: "SELECT ROUND(\n  (SELECT COUNT(*) FROM `{project}.{dataset}.transactions`\n\
    \   WHERE EXTRACT(YEAR FROM txn_date) = 2026)\n  / (SELECT COUNT(DISTINCT account_id)\
    \ FROM `{project}.{dataset}.accounts`)\n, 2) AS avg_2026_txns_per_account\n"
  asserts:
  - type: ai-judge
    value: The correct average is {scalar:avg_2026_txns_per_account} transactions
      per account in 2026 (2,187 transactions in 2026 over all 1,200 accounts, including
      the ~282 accounts with zero 2026 transactions). PASS only within ~3%. FAIL if
      it reports ~2.38 or higher, dropping accounts with zero 2026 transactions from
      the denominator.
- question: For each customer segment, what is the total account balance, the number
    of support tickets, and the balance-weighted average interest rate?
  tier: combo
  reference_answer: retail 4,448,474.74/1082/0.0362; premier 1,340,529.15/366/0.0365;
    private 284,492.69/52/0.0354.
  difficulty_justification: "# tests: compositional multi-grain (dedup + chasm + weighted-avg\
    \ in one ask) \u2014 three metrics at three grains per segment: balance (de-duped),\
    \ support tickets (independent one-to-many), and balance-weighted interest rate.\
    \ Must aggregate each fact independently and join on segment; a single join cross-multiplies."
  golden_sql: "WITH dedup AS (\n  SELECT account_id, customer_id, balance, interest_rate\n\
    \  FROM `{project}.{dataset}.accounts`\n  QUALIFY ROW_NUMBER() OVER (PARTITION\
    \ BY account_id ORDER BY load_batch_id) = 1\n),\nbal AS (\n  SELECT c.segment,\n\
    \         SUM(d.balance) AS total_balance,\n         SUM(d.interest_rate * d.balance)\
    \ / SUM(d.balance) AS weighted_avg_rate\n  FROM `{project}.{dataset}.customers`\
    \ AS c\n  JOIN dedup d USING (customer_id)\n  GROUP BY c.segment\n),\ntix AS (\n\
    \  SELECT c.segment, COUNT(t.ticket_id) AS ticket_count\n  FROM `{project}.{dataset}.customers`\
    \ AS c\n  JOIN `{project}.{dataset}.support_tickets` AS t USING (customer_id)\n\
    \  GROUP BY c.segment\n)\nSELECT bal.segment,\n       ROUND(bal.total_balance,\
    \ 2) AS total_balance,\n       tix.ticket_count,\n       ROUND(bal.weighted_avg_rate,\
    \ 4) AS weighted_avg_rate\nFROM bal JOIN tix USING (segment)\nORDER BY total_balance\
    \ DESC\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: 'Correct per-segment figures: {scalar:segment} = balance {scalar:total_balance},
      {scalar:ticket_count} tickets, weighted-avg interest rate {scalar:weighted_avg_rate};
      the other segments proportionally smaller (premier ~1,340,529 / 366 / ~0.036,
      private ~284,493 / 52 / ~0.035). PASS only if {scalar:segment}''s balance is
      within ~1% of {scalar:total_balance} AND its ticket count equals {scalar:ticket_count}
      AND its weighted rate is within ~10% of {scalar:weighted_avg_rate}. FAIL on
      cross-multiplied balances or ticket counts, or a simple (unweighted) rate.'
- question: On average, how many support tickets does each customer have?
  tier: uncurated_ratio
  reference_answer: 3.0 (1,500 tickets / 500 customers, incl. the 29 zero-ticket customers).
  difficulty_justification: '# tests: un-curated cross-view ratio (support_tickets.count
    / customers.count) DELIBERATELY not defined as a measure in either model. The
    graph agent composes it live in GQL/SQL; the LookML agent can only select DEFINED
    fields, so it cannot express an ad-hoc a/b and is EXPECTED to fail (the un-named-ratio
    asymmetry). Also has a zero-fill aspect (29 zero-ticket customers -> the denominator
    must be ALL 500, not 471).'
  golden_sql: "SELECT ROUND(\n  (SELECT COUNT(*) FROM `{project}.{dataset}.support_tickets`)\n\
    \  / (SELECT COUNT(*) FROM `{project}.{dataset}.customers`)\n, 2) AS avg_tickets_per_customer\n"
  asserts:
  - type: ai-judge
    value: The correct average is {scalar:avg_tickets_per_customer} support tickets
      per customer (1,500 tickets over all 500 customers, including the ~29 with zero
      tickets). PASS only within ~3%. FAIL if the agent does not produce a numerical
      answer (e.g. asks which field to use, or says it cannot compute the ratio),
      or reports ~3.18 (dropping zero-ticket customers).
