- question: On average, how many transactions does each account have?
  tier: zero_fill
  reference_answer: 16.67 (20,000 / 1,200 accounts, incl. 120 zero-txn accounts).
  difficulty_justification: "# tests: zero_fill \u2014 120 of the 1,200 accounts have\
