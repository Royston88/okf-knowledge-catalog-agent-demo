- question: How many accounts are jointly owned (owned by more than one customer),
    and what is their combined balance?
  tier: joint_ownership
  reference_answer: 180 accounts; combined balance 836,807.03.
  difficulty_justification: "# tests: joint_ownership (M:N) \u2014 account_owners\
    \ is a many-to-many bridge; ~15% of accounts have two owners. Joining the bridge\
    \ to accounts and counting/summing naively counts owner-rows (360) not accounts\
    \ (180) and doubles each joint account's balance. Correct = COUNT(DISTINCT account_id)\
    \ / balance summed once, over accounts with >=2 distinct owners."
  golden_sql: "WITH dedup AS (\n  SELECT account_id, balance\n  FROM `{project}.{dataset}.accounts`\n\
    \  QUALIFY ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY load_batch_id)\
    \ = 1\n),\njoint AS (\n  SELECT account_id\n  FROM `{project}.{dataset}.account_owners`\n\
    \  GROUP BY account_id\n  HAVING COUNT(DISTINCT customer_id) >= 2\n)\nSELECT COUNT(*)\
    \ AS joint_account_count, ROUND(SUM(d.balance), 2) AS joint_balance\nFROM joint\
    \ j JOIN dedup d USING (account_id)\n"
  asserts:
  - type: ai-judge
    value: There are {scalar:joint_account_count} jointly-owned accounts with a combined
      balance of {scalar:joint_balance}. PASS only if the response reports approximately
      {scalar:joint_account_count} accounts AND a combined balance within ~1% of {scalar:joint_balance}.
      FAIL if it reports the owner-row count (~360) or a doubled balance (~1.67M)
      from counting each joint account once per owner.
- question: What is the balance-weighted average interest rate across all accounts?
  tier: weighted_avg
  reference_answer: 0.0362 = SUM(rate*balance)/SUM(balance) on de-duplicated accounts.
  difficulty_justification: "# tests: weighted_avg (avg-of-avg) \u2014 naive AVG(interest_rate)\
    \ is an average-of-averages and also counts the double-load. Correct = balance-weighted\
    \ mean over de-duplicated accounts. interest_rate is strongly anti-correlated\
    \ with balance, so the two differ widely (simple AVG ~0.0549 vs weighted 0.0362)."
  golden_sql: "SELECT ROUND(SUM(interest_rate * balance) / SUM(balance), 4) AS weighted_avg_rate\n\
    FROM (\n  SELECT interest_rate, balance\n  FROM `{project}.{dataset}.accounts`\n\
    \  QUALIFY ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY load_batch_id)\
    \ = 1\n)\n"
  asserts:
  - type: ai-judge
    value: The correct balance-weighted average interest rate is {scalar:weighted_avg_rate}
      (about 3.6%). PASS only if the response reports approximately {scalar:weighted_avg_rate}
      (within ~5%). FAIL if it reports a simple unweighted AVG(interest_rate) (~0.0549
      / ~5.5%) or any figure that ignores balance weighting.
- question: What is our total account balance as of the most recent monthly snapshot?
  tier: semi_additive
  reference_answer: 6,375,161.17 (latest snapshot_month only).
  difficulty_justification: "# tests: semi_additive \u2014 balance_snapshots holds\
    \ 6 monthly point-in-time balances per account. A naive SUM(balance) across all\
    \ snapshots multiplies each account ~6x. Correct = period-end: sum only the most\
    \ recent snapshot_month."
  golden_sql: "SELECT ROUND(SUM(balance), 2) AS period_end_balance\nFROM `{project}.{dataset}.balance_snapshots`\n\
    WHERE snapshot_month = (\n  SELECT MAX(snapshot_month) FROM `{project}.{dataset}.balance_snapshots`\n\
    )\n"
  asserts:
  - type: ai-judge
    value: The correct total balance as of the most recent snapshot month (April 2026)
      is {scalar:period_end_balance}. PASS only within ~1%. FAIL if it sums balances
      across multiple months (several times larger, ~6x / ~35.5M).
- question: On average, how many transactions does each account have?
  tier: zero_fill
  reference_answer: 16.67 (20,000 / 1,200 accounts, incl. 120 zero-txn accounts).
  difficulty_justification: "# tests: zero_fill \u2014 120 of the 1,200 accounts have\
    \ zero transactions. The denominator must be ALL accounts. An inner join / graph\
    \ traversal drops the zero-transaction accounts, shrinking the denominator to\
    \ 1,080 and inflating the average to ~18.52."
  golden_sql: "SELECT ROUND(\n  (SELECT COUNT(*) FROM `{project}.{dataset}.transactions`)\n\
    \  / (SELECT COUNT(DISTINCT account_id) FROM `{project}.{dataset}.accounts`)\n\
    , 2) AS avg_txns_per_account\n"
  asserts:
  - type: ai-judge
    value: The correct average is {scalar:avg_txns_per_account} transactions per account
      (20,000 transactions over all 1,200 accounts, including the ~120 accounts with
      zero transactions). PASS only within ~2%. FAIL if it reports ~18.5 or higher,
      excluding zero-transaction accounts from the denominator.
- question: Splitting each jointly-owned account's balance equally among its owners,
    what total balance is attributed to primary vs joint owners?
  tier: m2n_split
  reference_answer: primary 5,655,093.07; joint 418,403.52 (sum 6,073,496.58 = total
    balance).
  difficulty_justification: "# tests: M:N SPLIT allocation (the 'split' half of count-once/split/allocate)\
    \ \u2014 attribute each account's balance to its owner ROWS, splitting joint accounts\
    \ equally by owner_count, grouped by ownership_role. A naive owner->account join\
    \ that does NOT divide by owner_count double-counts the 180 joint accounts (joint\
    \ role ~836,807 vs the split ~418,404; grand total ~6.91M vs the conserved 6.07M).\
    \ Graph: MATCH (a:Account)-[r:HasOwner]->() RETURN r.ownership_role, SUM(a.balance/a.owner_count)\
    \ \u2014 free (owner_count node prop + HasOwner edge). LookML: a total_allocated_balance\
    \ measure grouped by ownership_role. (Attributing by an OWNER attribute like segment\
    \ is deliberately avoided: a 2nd customers join duplicates 'segment' and the agent\
    \ conflates it, breaking plain segment-BI \u2014 see RESULTS.md.)"
  golden_sql: "WITH dedup AS (\n  SELECT account_id, balance FROM `{project}.{dataset}.accounts`\n\
    \  QUALIFY ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY load_batch_id)\
    \ = 1\n),\noc AS (\n  SELECT account_id, COUNT(DISTINCT customer_id) AS owner_count\n\
    \  FROM `{project}.{dataset}.account_owners` GROUP BY account_id\n)\nSELECT ao.ownership_role,\
    \ ROUND(SUM(d.balance / oc.owner_count), 2) AS attributed_balance\nFROM `{project}.{dataset}.account_owners`\
    \ ao\nJOIN dedup d USING (account_id)\nJOIN oc USING (account_id)\nGROUP BY ao.ownership_role\n\
    ORDER BY attributed_balance DESC\n"
  asserts:
  - type: ai-judge
    value: 'The response must split jointly-owned accounts equally among their owners
      and attribute balance by owner role: primary ~{scalar:attributed_balance} (~5,655,093)
      and joint ~418,404, summing to ~6,073,497 (the total account balance). PASS
      only within ~2% AND if the two role figures sum to ~6.07M. FAIL if joint accounts
      are NOT split (joint role ~836,807, i.e. each joint account counted for both
      owners).'
- question: What is our average monthly total account balance across the snapshot
    history?
  tier: semi_additive_avg
  reference_answer: 5,922,272.52 (average of the 6 monthly total balances = 35,533,635.11
    / 6).
  difficulty_justification: "# tests: SEMI-ADDITIVE average-over-time (the 'or average'\
    \ half of period-end/average) \u2014 the average of the monthly TOTAL balances:\
    \ SUM across accounts per month, then AVG across the 6 months. Wrong #1: SUM across\
    \ months = 35.5M (the semi-additive sum trap, ~6x). Wrong #2: AVG of per-account-month\
    \ rows = ~4,935 (averages rows, not monthly totals). LookML: the identity total_balance\
    \ / COUNT(DISTINCT month). Graph: a materialized MonthlyBalance node."
  golden_sql: "WITH monthly AS (\n  SELECT snapshot_month, SUM(balance) AS monthly_total\n\
    \  FROM `{project}.{dataset}.balance_snapshots`\n  GROUP BY snapshot_month\n)\n\
    SELECT ROUND(AVG(monthly_total), 2) AS avg_monthly_total_balance FROM monthly\n"
  asserts:
  - type: ai-judge
    value: "The correct average monthly total account balance is {scalar:avg_monthly_total_balance}\
      \ (~5,922,273) \u2014 the average of the six monthly total balances. PASS only\
      \ within ~2%. FAIL if it reports ~35.5M (summing balance across all months)\
      \ or ~4,935 (averaging per-account-month rows instead of monthly totals)."
