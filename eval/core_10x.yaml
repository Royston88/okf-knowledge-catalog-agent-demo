    \ / COUNT(DISTINCT month). Graph: a materialized MonthlyBalance node."
  golden_sql: "WITH monthly AS (\n  SELECT snapshot_month, SUM(balance) AS monthly_total\n\
    \  FROM `{project}.{dataset}.balance_snapshots`\n  GROUP BY snapshot_month\n)\n\
