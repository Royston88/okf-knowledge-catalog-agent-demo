- question: Among premier-segment customers, on average how many transactions does
    each account have?
  tier: bi_filter_zerofill
  reference_answer: 16.03 (txns / all premier accounts, incl. zero-txn).
  difficulty_justification: "# tests: zero_fill \xD7 conditional filter \u2014 average\
    \ transactions per account for premier-segment customers, keeping their zero-transaction\
    \ accounts in the denominator. An inner traversal drops dormant premier accounts\
    \ (~18.09)."
  golden_sql: "WITH prem AS (\n  SELECT a.account_id\n  FROM `{project}.{dataset}.accounts`\
    \ AS a\n  JOIN `{project}.{dataset}.customers` AS c USING (customer_id)\n  WHERE\
    \ c.segment = 'premier'\n  QUALIFY ROW_NUMBER() OVER (PARTITION BY a.account_id\
    \ ORDER BY a.load_batch_id) = 1\n)\nSELECT ROUND(\n  (SELECT COUNT(*) FROM `{project}.{dataset}.transactions`\
    \ t JOIN prem USING (account_id))\n  / (SELECT COUNT(*) FROM prem)\n, 2) AS avg_txns_premier\n"
  asserts:
  - type: ai-judge
    value: The correct average for premier-segment customers is {scalar:avg_txns_premier}
