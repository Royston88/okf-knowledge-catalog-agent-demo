- question: How much total wire amount was SENT on a bank holiday, and separately
    how much was RECEIVED on a bank holiday?
  tier: role_playing
  reference_answer: 'Two figures from the SAME calendar dimension under two date roles:
    amount sent on a holiday (join calendar on sent_date) and amount received on a
    holiday (join calendar on received_date). They are different numbers.'
  difficulty_justification: "# tests: role_playing \u2014 the calendar dim must be\
    \ joined TWICE to wire_transfers, once per date role (sent vs received). Conflating\
    \ the two roles (one calendar join, or using one date for both) cannot separate\
    \ sent-on-holiday from received-on-holiday."
  golden_sql: "SELECT\n  ROUND(SUM(IF(cs.is_holiday, w.amount, 0)), 2) AS sent_on_holiday,\n\
    \  ROUND(SUM(IF(cr.is_holiday, w.amount, 0)), 2) AS received_on_holiday\nFROM\
    \ `{project}.{dataset}.wire_transfers` w\nJOIN `{project}.{dataset}.calendar`\
    \ cs ON w.sent_date = cs.cal_date\nJOIN `{project}.{dataset}.calendar` cr ON w.received_date\
    \ = cr.cal_date\n"
  asserts:
  - type: ai-judge
    value: The correct figures are ~{scalar:sent_on_holiday} sent on a holiday and
      ~{scalar:received_on_holiday} received on a holiday, resolved via the SAME calendar
      dimension under two distinct date roles. PASS only if BOTH figures are reported
      (each within ~2%) and clearly distinguished as sent vs received. FAIL if only
      one figure is given or the two roles are conflated.
- question: "How many customers are in customer 1's referral network \u2014 i.e. everyone\
    \ customer 1 referred, directly or indirectly, to any depth?"
  tier: recursive_hierarchy
  reference_answer: "The full transitive referral subtree rooted at customer 1 (referred_by\
    \ chains), counted to arbitrary depth \u2014 NOT just customer 1's direct referrals."
  difficulty_justification: "# tests: recursive_hierarchy \u2014 referred_by is a\
    \ self-referencing edge. The correct answer walks the chain transitively (graph:\
    \ MATCH (a)-[:ReferredBy*]->(b); LookML: a recursive derived table). Counting\
    \ only DIRECT referrals (one hop) undercounts the subtree."
  golden_sql: "WITH RECURSIVE tree AS (\n  SELECT customer_id\n  FROM `{project}.{dataset}.customers`\n\
    \  WHERE referred_by = 1\n  UNION ALL\n  SELECT c.customer_id\n  FROM `{project}.{dataset}.customers`\
    \ c\n  JOIN tree t ON c.referred_by = t.customer_id\n)\nSELECT COUNT(*) AS subtree_size\
    \ FROM tree\n"
  asserts:
  - type: ai-judge
    value: The correct size of customer 1's full (transitive) referral subtree is
      ~{scalar:subtree_size}. PASS only if the response reports approximately that
      figure (the whole multi-level network). FAIL if it reports only the direct (one-hop)
      referrals, a materially smaller number.
- question: Which state has the highest total payment amount, and which region is
    it in?
  tier: hierarchy_drill
  reference_answer: "The single (region, state) with the largest total payment amount\
    \ \u2014 the leaf of the region -> state -> city geography drill path."
  difficulty_justification: "# tests: hierarchy_drill \u2014 the region/state/city\
    \ levels must all be exposed and groupable so the agent can roll payments up the\
    \ geography path and rank the leaf."
  golden_sql: 'SELECT c.region, c.state, ROUND(SUM(p.amount), 2) AS total_amount

    FROM `{project}.{dataset}.payments` p

    JOIN `{project}.{dataset}.customers` c USING (customer_id)

    GROUP BY c.region, c.state

    ORDER BY total_amount DESC

    LIMIT 1

    '
  asserts:
  - type: ai-judge
    value: The top state by total payment amount is {scalar:state} (in region {scalar:region})
      with ~{scalar:total_amount}. PASS only if the response names {scalar:state}
      as the top state and its region as {scalar:region}.
- question: 'How many loan applications have reached each stage: applied, approved,
    funded, and closed?'
  tier: accumulating_funnel
  reference_answer: 'A monotonically NON-increasing funnel: every application is applied;
    fewer are approved; fewer funded; fewer closed (a milestone is reached iff its
    date column is populated).'
  difficulty_justification: "# tests: accumulating_funnel \u2014 loan_applications\
    \ is an accumulating snapshot with four milestone dates that fill in over time.\
    \ A stage is reached iff its date is non-NULL. Reporting the same total for every\
    \ stage (ignoring NULLs) is wrong."
  golden_sql: "SELECT\n  COUNTIF(applied_date  IS NOT NULL) AS applied,\n  COUNTIF(approved_date\
    \ IS NOT NULL) AS approved,\n  COUNTIF(funded_date   IS NOT NULL) AS funded,\n\
    \  COUNTIF(closed_date   IS NOT NULL) AS closed\nFROM `{project}.{dataset}.loan_applications`\n"
  asserts:
  - type: ai-judge
    value: The correct funnel is applied ~{scalar:applied}, approved ~{scalar:approved},
      funded ~{scalar:funded}, closed ~{scalar:closed} (each stage counts rows whose
      milestone date is populated, so the counts strictly decrease). PASS only if
      the four stage counts are reported and decrease down the funnel. FAIL if every
      stage shows the same total (NULL milestones not respected).
- question: On average, how many days does it take from loan application to approval?
  tier: milestone_lag
  reference_answer: Average DATE_DIFF(approved_date, applied_date) over APPROVED applications
    only (rows with a non-NULL approved_date).
  difficulty_justification: "# tests: milestone_lag \u2014 a duration between two\
    \ accumulating-snapshot milestones. Correct = average days over rows that actually\
    \ reached approval. Counting not-yet-approved rows (NULL approved_date) as 0 days\
    \ deflates the average."
  golden_sql: 'SELECT ROUND(AVG(DATE_DIFF(approved_date, applied_date, DAY)), 1) AS
    avg_days_to_approve

    FROM `{project}.{dataset}.loan_applications`

    WHERE approved_date IS NOT NULL

    '
  asserts:
  - type: ai-judge
    value: The correct average time from application to approval is ~{scalar:avg_days_to_approve}
      days (over approved applications only). PASS only within ~10%. FAIL if it treats
      un-approved applications as 0 days (a materially smaller average) or reports
      a nonsensical figure.
- question: What was the year-over-year change in total payment amount from 2024 to
    2025, as a percentage?
  tier: period_over_period
  reference_answer: "(2025 total - 2024 total) / 2024 total \u2014 a period comparison,\
    \ not a single total (2024 and 2025 are both full years in the data)."
  difficulty_justification: "# tests: period_over_period \u2014 a comparison of a\
    \ measure to the prior period. This is a self-join/window, NOT a plain time filter,\
    \ so it must be modeled (LookML native period_over_period; graph LAG rollup).\
    \ Reporting one year's total, or an absolute delta when asked for a percentage,\
    \ is wrong."
  golden_sql: "WITH y AS (\n  SELECT EXTRACT(YEAR FROM payment_date) AS yr, SUM(amount)\
    \ AS total\n  FROM `{project}.{dataset}.payments`\n  GROUP BY yr\n)\nSELECT ROUND((y25.total\
    \ - y24.total) / y24.total, 4) AS yoy_growth\nFROM (SELECT total FROM y WHERE\
    \ yr = 2025) y25,\n     (SELECT total FROM y WHERE yr = 2024) y24\n"
  asserts:
  - type: ai-judge
    value: The correct year-over-year growth in total payment amount from 2024 to
      2025 is ~{scalar:yoy_growth} (i.e. that fraction, e.g. 0.12 = +12%). PASS only
      if the response reports the YoY change as a percentage within ~2 percentage
      points. FAIL if it reports only a single year's total or confuses the direction.
- question: What is the total wire amount attributed to each customer segment, using
    the segment each customer had AT THE TIME of the wire (not their current segment)?
  tier: as_of_scd2
  reference_answer: 'Total wire amount by the point-in-time segment: join each wire
    to the customer_segment_history version whose [valid_from, valid_to) window contains
    the wire''s sent_date. This differs from using the customer''s CURRENT segment.'
  difficulty_justification: "# tests: as_of_scd2 \u2014 customer_segment_history is\
    \ an SCD2 dim (a version per [valid_from, valid_to)). Correct = a range join on\
    \ the validity window at sent_date. A plain equi-join to the customer's current\
    \ segment silently mis-attributes every wire sent before the customer's latest\
    \ segment change."
  golden_sql: "SELECT h.segment, ROUND(SUM(w.amount), 2) AS wire_amount\nFROM `{project}.{dataset}.wire_transfers`\
    \ w\nJOIN `{project}.{dataset}.customer_segment_history` h\n  ON w.customer_id\
    \ = h.customer_id\n AND w.sent_date >= h.valid_from\n AND w.sent_date <  h.valid_to\n\
    GROUP BY h.segment\nORDER BY wire_amount DESC\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: The correct point-in-time attribution assigns each wire to the segment
      valid at its sent_date; the top segment is {scalar:segment} with ~{scalar:wire_amount}
      across {row_count} segments. PASS only if the response attributes by the AS-OF
      (historical) segment (top segment {scalar:segment} within ~2%). FAIL if it uses
      each customer's CURRENT segment (an equi-join to customers.segment).
- question: By month, what is the running cumulative total of payment amount?
  tier: window_cumulative
  reference_answer: One row per month with a running total that increases monotonically
    and ends at the grand total of all payments.
  difficulty_justification: "# tests: window_cumulative \u2014 a running total is\
    \ a window function (SUM() OVER (ORDER BY month UNBOUNDED PRECEDING)), not a plain\
    \ SUM. LookML needs a rollup derived_table (a table-calc can't be a measure);\
    \ the graph materializes it."
  golden_sql: "SELECT payment_month,\n       ROUND(SUM(SUM(amount)) OVER (ORDER BY\
    \ payment_month ROWS UNBOUNDED PRECEDING), 2) AS running_total\nFROM `{project}.{dataset}.payments`\n\
    GROUP BY payment_month\nORDER BY payment_month\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: "The result must give a per-month running cumulative total of payment amount\
      \ across {row_count} months. Judge the DATA the system returned \u2014 the query\
      \ result rows and/or the chart it plotted, including a cumulative transform\
      \ applied by the chart \u2014 NOT the wording of the final text: a final answer\
      \ that summarizes instead of listing every month is ACCEPTABLE. PASS only if\
      \ the delivered values are cumulative (monotonically increasing) and the final\
      \ month equals the overall total. FAIL if the delivered figures are per-month\
      \ totals that do not accumulate."
- question: What is the trailing 3-month moving average of monthly payment amount
    for the most recent month?
  tier: window_moving_avg
  reference_answer: Average of the last three monthly payment totals (the most recent
    month and the two before it).
  difficulty_justification: "# tests: window_moving_avg \u2014 a trailing-window average\
    \ (AVG() OVER (ORDER BY month ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)) over\
    \ monthly totals, evaluated at the latest month. Not a plain overall average."
  golden_sql: "WITH m AS (\n  SELECT payment_month, SUM(amount) AS monthly_total\n\
    \  FROM `{project}.{dataset}.payments`\n  GROUP BY payment_month\n),\nmv AS (\n\
    \  SELECT payment_month,\n         AVG(monthly_total) OVER (ORDER BY payment_month\
    \ ROWS BETWEEN 2 PRECEDING AND CURRENT ROW) AS moving_avg\n  FROM m\n)\nSELECT\
    \ ROUND(moving_avg, 2) AS trailing_3mo_avg\nFROM mv\nORDER BY payment_month DESC\n\
    LIMIT 1\n"
  asserts:
  - type: ai-judge
    value: The correct trailing 3-month moving average of monthly payment amount at
      the most recent month is ~{scalar:trailing_3mo_avg}. PASS only within ~5%. FAIL
      if it reports the plain overall monthly average or a single month's total.
- question: What percentage of total payment amount comes from each channel?
  tier: window_pct
  reference_answer: Each channel's share of the overall payment total; the shares
    sum to 100%.
  difficulty_justification: "# tests: window_pct \u2014 share-of-total (SUM per channel\
    \ / SUM() OVER () grand total). The shares must sum to 1. Reporting raw per-channel\
    \ totals (not shares) is wrong."
  golden_sql: "SELECT channel,\n       ROUND(SAFE_DIVIDE(SUM(amount), SUM(SUM(amount))\
    \ OVER ()), 4) AS pct_of_total\nFROM `{project}.{dataset}.payments`\nGROUP BY\
    \ channel\nORDER BY pct_of_total DESC\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: The response must give each channel's PERCENTAGE of total payment amount
      across {row_count} channels, and the shares must sum to ~100%. PASS only if
      the values are shares (summing to ~1.0), with the largest channel {scalar:channel}
      at ~{scalar:pct_of_total}. FAIL if it returns raw totals instead of percentages.
- question: Attributing each syndicated loan's principal to its investors by their
    allocation percentage, what total principal is attributed to each participation
    tier (lead, co-lead, participant)?
  tier: m2n_weighted
  reference_answer: For each investor row, amount * allocation_pct, summed by participation_tier.
    The allocation_pct values sum to 1 per loan, so the tier totals sum to the total
    loan principal (conservation).
  difficulty_justification: "# tests: m2n_weighted \u2014 a many-to-many split by\
    \ an EXPLICIT per-row weight (allocation_pct), grouped by a bridge column (participation_tier).\
    \ Not weighting (joining investors to loans and summing full principal per investor)\
    \ double-counts each loan across its investors, inflating the grand total far\
    \ above total principal."
  golden_sql: "SELECT li.participation_tier,\n       ROUND(SUM(la.amount * li.allocation_pct),\
    \ 2) AS attributed_principal\nFROM `{project}.{dataset}.loan_investors` li\nJOIN\
    \ `{project}.{dataset}.loan_applications` la USING (application_id)\nGROUP BY\
    \ li.participation_tier\nORDER BY attributed_principal DESC\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: 'The correct weighted attribution multiplies each loan''s principal by
      each investor''s allocation_pct and sums by tier: {scalar:participation_tier}
      is the largest at ~{scalar:attributed_principal}, across {row_count} tiers whose
      totals sum to the overall loan principal (conserved). PASS only if the split
      is weighted by allocation_pct (tier totals summing to total principal). FAIL
      if full principal is counted for every investor (grand total far exceeds total
      principal).'
- question: For mortgage loans only, what is the average number of days from application
