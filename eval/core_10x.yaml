      excluding zero-transaction accounts from the denominator.
- question: Splitting each jointly-owned account's balance equally among its owners,
    what total balance is attributed to primary vs joint owners?
  tier: m2n_split
  reference_answer: primary 5,655,093.07; joint 418,403.52 (sum 6,073,496.58 = total
    balance).
  difficulty_justification: "# tests: M:N SPLIT allocation (the 'split' half of count-once/split/allocate)\
    \ \u2014 attribute each account's balance to its owner ROWS, splitting joint accounts\
    \ equally by owner_count, grouped by ownership_role. A naive owner->account join\
    \ that does NOT divide by owner_count double-counts the 180 joint accounts (joint\
    \ role ~836,807 vs the split ~418,404; grand total ~6.91M vs the conserved 6.07M).\
    \ Graph: MATCH (a:Account)-[r:HasOwner]->() RETURN r.ownership_role, SUM(a.balance/a.owner_count)\
    \ \u2014 free (owner_count node prop + HasOwner edge). LookML: a total_allocated_balance\
    \ measure grouped by ownership_role. (Attributing by an OWNER attribute like segment\
    \ is deliberately avoided: a 2nd customers join duplicates 'segment' and the agent\
    \ conflates it, breaking plain segment-BI \u2014 see RESULTS.md.)"
  golden_sql: "WITH dedup AS (\n  SELECT account_id, balance FROM `{project}.{dataset}.accounts`\n\
    \  QUALIFY ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY load_batch_id)\
    \ = 1\n),\noc AS (\n  SELECT account_id, COUNT(DISTINCT customer_id) AS owner_count\n\
    \  FROM `{project}.{dataset}.account_owners` GROUP BY account_id\n)\nSELECT ao.ownership_role,\
    \ ROUND(SUM(d.balance / oc.owner_count), 2) AS attributed_balance\nFROM `{project}.{dataset}.account_owners`\
    \ ao\nJOIN dedup d USING (account_id)\nJOIN oc USING (account_id)\nGROUP BY ao.ownership_role\n\
    ORDER BY attributed_balance DESC\n"
  asserts:
  - type: ai-judge
    value: 'The response must split jointly-owned accounts equally among their owners
      and attribute balance by owner role: primary ~{scalar:attributed_balance} (~5,655,093)
      and joint ~418,404, summing to ~6,073,497 (the total account balance). PASS
      only within ~2% AND if the two role figures sum to ~6.07M. FAIL if joint accounts
      are NOT split (joint role ~836,807, i.e. each joint account counted for both
      owners).'
- question: What is our average monthly total account balance across the snapshot
    history?
  tier: semi_additive_avg
  reference_answer: 5,922,272.52 (average of the 6 monthly total balances = 35,533,635.11
    / 6).
  difficulty_justification: "# tests: SEMI-ADDITIVE average-over-time (the 'or average'\
    \ half of period-end/average) \u2014 the average of the monthly TOTAL balances:\
    \ SUM across accounts per month, then AVG across the 6 months. Wrong #1: SUM across\
