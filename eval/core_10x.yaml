    value: "The correct average monthly total account balance is {scalar:avg_monthly_total_balance}\
      \ (~5,922,273) \u2014 the average of the six monthly total balances. PASS only\
      \ within ~2%. FAIL if it reports ~35.5M (summing balance across all months)\
      \ or ~4,935 (averaging per-account-month rows instead of monthly totals)."
