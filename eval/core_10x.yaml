- question: For each customer segment, what is the total account balance and how many
    support tickets have been filed?
  tier: chasm
  reference_answer: retail 4,448,474.74/1082; premier 1,340,529.15/366; private 284,492.69/52.
  difficulty_justification: "# tests: chasm \u2014 accounts and support_tickets are\
    \ two independent one-to-many children of customer. A single customers\xD7accounts\xD7\
    tickets join cross-multiplies both; balance is also inflated by the double-load.\
    \ Correct = aggregate each fact independently (de-duping accounts) then join on\
    \ segment."
  golden_sql: "WITH bal AS (\n  SELECT c.segment, SUM(a.balance) AS total_balance\n\
    \  FROM `{project}.{dataset}.customers` AS c\n  JOIN (\n    SELECT account_id,\
    \ customer_id, balance\n    FROM `{project}.{dataset}.accounts`\n    QUALIFY ROW_NUMBER()\
    \ OVER (PARTITION BY account_id ORDER BY load_batch_id) = 1\n  ) AS a USING (customer_id)\n\
    \  GROUP BY c.segment\n),\ntix AS (\n  SELECT c.segment, COUNT(t.ticket_id) AS\
    \ ticket_count\n  FROM `{project}.{dataset}.customers` AS c\n  JOIN `{project}.{dataset}.support_tickets`\
    \ AS t USING (customer_id)\n  GROUP BY c.segment\n)\nSELECT bal.segment, ROUND(bal.total_balance,\
    \ 2) AS total_balance, tix.ticket_count\nFROM bal JOIN tix USING (segment)\nORDER\
    \ BY total_balance DESC\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: "Correct per-segment figures: {scalar:segment} = balance {scalar:total_balance}\
      \ with {scalar:ticket_count} tickets, and the other two segments proportionally\
      \ smaller (premier ~1,340,529 / 366, private ~284,493 / 52). PASS only if the\
      \ {scalar:segment} balance is within ~1% of {scalar:total_balance} AND its ticket\
      \ count equals {scalar:ticket_count}. FAIL on a materially larger balance (e.g.\
      \ ~4.66M for retail from the double-load, or far larger from a customers\xD7\
      accounts\xD7tickets cross-join) or cross-multiplied ticket counts."
- question: By account type, what is the total account balance and the total transaction
    amount?
  tier: fan
  reference_answer: checking 3,180,101.99/581,806.55; savings 2,169,656.02/362,129.77;
    credit 723,738.57/114,924.45.
  difficulty_justification: "# tests: fan \u2014 joining accounts->transactions then\
    \ SUM(balance) repeats each account's balance once per transaction (~x17). Correct\
    \ = aggregate balance (de-duped) and transactions separately, then join on account_type."
  golden_sql: "WITH bal AS (\n  SELECT account_type, SUM(balance) AS total_balance\n\
    \  FROM (\n    SELECT account_id, account_type, balance\n    FROM `{project}.{dataset}.accounts`\n\
    \    QUALIFY ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY load_batch_id)\
    \ = 1\n  )\n  GROUP BY account_type\n),\ntxn AS (\n  SELECT a.account_type, SUM(t.amount)\
    \ AS total_txn_amount\n  FROM `{project}.{dataset}.transactions` AS t\n  JOIN\
    \ (\n    SELECT account_id, account_type\n    FROM `{project}.{dataset}.accounts`\n\
    \    QUALIFY ROW_NUMBER() OVER (PARTITION BY account_id ORDER BY load_batch_id)\
    \ = 1\n  ) AS a USING (account_id)\n  GROUP BY a.account_type\n)\nSELECT bal.account_type,\
    \ ROUND(bal.total_balance, 2) AS total_balance,\n       ROUND(txn.total_txn_amount,\
    \ 2) AS total_txn_amount\nFROM bal JOIN txn USING (account_type)\nORDER BY total_balance\
    \ DESC\n"
  asserts:
  - type: data-check-row-count
  - type: ai-judge
    value: 'Correct: {scalar:account_type} = total balance {scalar:total_balance}
      and total transaction amount {scalar:total_txn_amount}; the other account types
      proportionally smaller (savings ~2,169,656, credit ~723,739). PASS only if the
      {scalar:account_type} balance is within ~1% of {scalar:total_balance}. FAIL
