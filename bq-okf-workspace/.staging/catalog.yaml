# generated overview on these entries is left untouched, so Phase 7 /
# Measurement G keeps an unmodified control. Adding
# `dataplex-types.global.overview` here would start overwriting it.
scope: bq-dataset.royston-dev-8253.cymbal_bank_v6z_scaffold_demo_copy
layout: documents
snapshot:
  entries:
    - dataplex-types.global.bigquery-dataset
    - dataplex-types.global.bigquery-table
  aspects:
    - dataplex-types.global.overview
    - royston-dev-8253.us.okf
publishing:
  entries:
    - dataplex-types.global.bigquery-dataset
    - dataplex-types.global.bigquery-table
  aspects:
    - royston-dev-8253.us.okf
