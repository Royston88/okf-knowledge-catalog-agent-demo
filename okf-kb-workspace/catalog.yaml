# LINK MANAGEMENT IS DELIBERATELY LEFT TO `link-concepts.ts`.
# `entryLinks:` is NOT declared here, and that is now the safe choice rather
# than the destructive one. kcmd's push used to reconcile EntryLinks
# unconditionally, so omitting `entryLinks:` meant an unfiltered lookup and it
# deleted every link the bundle did not describe — measured, it destroyed all 12
# scan-generated `schema-join` links in this dataset, silently. That block is now
# guarded (sync.ts, "A manifest that says nothing about links must not manage
# links"), so omitting it means kcmd leaves links ALONE.
# Declaring `entryLinks: [related]` instead makes every push delete our related
# links and `reconcileRelatedLinks` recreate them seconds later — correct end
# state, pointless churn, and a window where the catalog has no links at all.
# `kcmd push` unconditionally reconciles EntryLinks on every entry it touches
# (sync.ts ~425, no guard). It calls lookupEntryLinks with the types listed
# HERE as the filter — and when the list is absent the lookup is UNFILTERED, so
# every link the local bundle does not describe is deleted. Measured: a push
# with no `entryLinks:` destroyed all 12 scan-generated `schema-join` links in
# this dataset, silently.
# Listing `related` narrows the blast radius to the link type we own; the scan's
# schema-join links are then invisible to the reconciler and survive.
